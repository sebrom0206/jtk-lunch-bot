name: Scrape weekly menu

on:
  schedule:
    - cron: "0 6 * * 1"  # mandag 06:00 UTC
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install playwright
          playwright install --with-deps chromium

      - name: Run scraper
        env:
          JTK_LOCATIONS: ${{ secrets.JTK_LOCATIONS }}
        run: python -m jtkbot.cli scrape

      - name: Commit updated menu
        run: |
          git config user.name "jtk-lunch-bot"
          git config user.email "actions@github.com"
          git add data/week.json
          git diff --staged --quiet || git commit -m "Update weekly menu"
          git push